name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Folder structure banao
        run: |
          mkdir -p app/src/main/java/com/priv/browser
          mv app-build.gradle.kts app/build.gradle.kts
          mv AndroidManifest.xml app/src/main/
          mv MainActivity.kt app/src/main/java/com/priv/browser/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: PrivBrowser-APK
          path: app/build/outputs/apk/debug/app-debug.apk
